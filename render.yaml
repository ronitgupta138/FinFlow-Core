databases:
  - name: finflow-db
    databaseName: financeflow_db
    user: finflow_user
    plan: free
    region: singapore

services:
  - type: web
    name: finflow-core
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: finflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finflow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: finflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finflow-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: INGESTION_ENABLED
        value: "true"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
