name: Production Keep-Alive Ping

on:
  schedule:
    # Ping every 14 minutes to eliminate Render free-tier container cold starts
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Health Endpoint
        run: |
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: Mozilla/5.0 (GitHubActions/KeepAlive)" --connect-timeout 30 --max-time 90 https://finflow-core.onrender.com/api/health || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Production instance is alive and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Warning: Service failed to respond with 200 after 3 attempts."
          exit 1
